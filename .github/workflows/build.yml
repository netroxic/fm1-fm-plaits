# Builds the Generative FM-PLAITS firmware for the M-VAVE FM-1 on GitHub's
# free Windows machines. Upload FM1_FM_PLAITS_v1_source.zip to the repository
# (or the unzipped source), add this file, and download the result from
# Actions -> latest run -> Artifacts -> FM1-FM-PLAITS-firmware.
name: Build FM-1 firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Find the source
        shell: pwsh
        run: |
          if (Test-Path build.bat) { $root = (Get-Location).Path }
          else {
            $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
            if (!$zip) { throw 'Upload FM1_FM_PLAITS_v1_source.zip to the repository first.' }
            Expand-Archive $zip.FullName -DestinationPath src
            $root = (Get-ChildItem src -Recurse -Filter build.bat | Select-Object -First 1).DirectoryName
          }
          Write-Host "Source: $root"
          "FM1_ROOT=$root" >> $env:GITHUB_ENV

      - name: Install the JieLi PI32v2 toolchain
        shell: pwsh
        timeout-minutes: 30
        run: |
          $want = (Get-Content (Join-Path $env:FM1_ROOT 'sdk/manifest.json') -Raw | ConvertFrom-Json).external_toolchain.files.'bin/clang.exe'
          function Find-Toolchain([string[]]$bases) {
            $found = @()
            foreach ($base in $bases) {
              if (!$base -or !(Test-Path $base)) { continue }
              $found += Get-ChildItem $base -Recurse -Depth 10 -Filter clang.exe -ErrorAction SilentlyContinue |
                Where-Object { Test-Path (Join-Path $_.DirectoryName 'pi32v2-ld.exe') }
            }
            foreach ($c in $found) {
              $h = (Get-FileHash $c.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "candidate $($c.FullName) $h"
              if ($h -eq $want) { return (Split-Path $c.DirectoryName) }
            }
            if ($found) { return (Split-Path $found[0].DirectoryName) }
            return $null
          }
          $exe = "$env:RUNNER_TEMP\jl-toolchain.exe"
          $t = [Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest 'https://pkgman.jieliapp.com/s/win-toolchain' -OutFile $exe -MaximumRedirection 10
          Write-Host ("Downloaded {0:N0} bytes in {1:N0} s" -f (Get-Item $exe).Length, $t.Elapsed.TotalSeconds)

          # 1) Unpack the Inno Setup installer without running it.
          $x = "$env:RUNNER_TEMP\jlx"
          choco install innoextract -y --no-progress | Out-Null
          $ie = (Get-Command innoextract -ErrorAction SilentlyContinue).Source
          if ($ie) {
            & $ie --version | Select-Object -First 1
            & $ie --info $exe 2>&1 | Select-Object -First 20
            & $ie -e -s -d $x $exe 2>&1 | Select-Object -Last 15
          }
          $tc = Find-Toolchain @($x)

          # 2) Otherwise run the installer silently with a log (max 8 minutes).
          if (!$tc) {
            $log = "$env:RUNNER_TEMP\jl-setup.log"
            $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOCANCEL','/DIR=C:\JL',"/LOG=$log" -PassThru
            if (!$p.WaitForExit(480000)) { Write-Host 'Installer still running after 8 min: stopping it'; $p.Kill() }
            if (Test-Path $log) { Write-Host '---- installer log (last 60 lines) ----'; Get-Content $log -Tail 60 }
            $tc = Find-Toolchain @('C:\JL', 'C:\Program Files', 'C:\Program Files (x86)', $env:LOCALAPPDATA, $env:APPDATA)
          }
          if (!$tc) {
            $lines = @('---- unpacked files containing clang / ld / bin ----')
            $lines += Get-ChildItem $x -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'clang|ld\.exe|\\bin\\' } |
              Select-Object -First 40 | ForEach-Object { $_.FullName }
            $lines += '---- top of unpacked tree ----'
            $lines += Get-ChildItem $x -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName }
            $lines | ForEach-Object { Write-Host $_ }
            Write-Host ("::error title=Toolchain not found::" + (($lines -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')))
            throw 'JieLi toolchain not found. Send the lines above to Claude.'
          }
          Write-Host "Toolchain: $tc"
          $ver = (& "$tc\bin\clang.exe" --version 2>&1 | Select-Object -First 1)
          $global:LASTEXITCODE = 0
          "FM1_PI32_TOOLCHAIN=$tc" >> $env:GITHUB_ENV

          # Compare with the exact compiler the SDK was made with (sdk/manifest.json).
          $mf = Join-Path $env:FM1_ROOT 'sdk/manifest.json'
          $m = Get-Content $mf -Raw | ConvertFrom-Json
          $mis = @(); $miss = @(); $new = [ordered]@{}
          foreach ($e in $m.external_toolchain.files.PSObject.Properties) {
            $f = Join-Path $tc $e.Name
            if (!(Test-Path $f)) { $miss += $e.Name; continue }
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $new[$e.Name] = $h
            if ($h -ne $e.Value) { $mis += $e.Name }
          }
          $total = @($m.external_toolchain.files.PSObject.Properties).Count
          $msg = "clang: $ver | SDK wants: $($m.external_toolchain.name) | $total files: $($mis.Count) different, $($miss.Count) missing | different: $(($mis | Select-Object -First 12) -join ', ') | missing: $(($miss | Select-Object -First 12) -join ', ')"
          Write-Host $msg
          if ($mis.Count -or $miss.Count) {
            # JieLi only offers its current compiler. Use it ("compat" build): record its
            # hashes in the SDK contract; every later layout/SRAM/link check still runs.
            foreach ($r in @('bin/clang.exe','bin/pi32v2-ld.exe','bin/LLVMgold.dll','bin/llvm-nm.exe','bin/llvm-objcopy.exe')) {
              if (!$new.Contains($r)) { Write-Host "::error title=Toolchain::$msg"; throw "Toolchain lacks $r" }
            }
            $m.external_toolchain.files = [pscustomobject]$new
            $m.external_toolchain.name = "$($m.external_toolchain.name) [compat: $ver]"
            [IO.File]::WriteAllText($mf, ($m | ConvertTo-Json -Depth 32))
            Write-Host "::warning title=Compat toolchain::$msg"
          } else {
            Write-Host "::notice title=Exact toolchain::$msg"
          }

      - name: Build firmware and updater page
        shell: pwsh
        env:
          FM1_SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          Set-Location $env:FM1_ROOT
          $log = "$env:RUNNER_TEMP\build.log"
          # build.bat runs Windows PowerShell 5.1: give it its own module path.
          cmd /d /c "set PSModulePath=&& call build.bat --package > $log 2>&1"
          $rc = $LASTEXITCODE
          Get-Content $log
          if ($rc -ne 0) {
            $tail = (Get-Content $log | Where-Object { $_.Trim() } | Select-Object -Last 45) -join "`n"
            Write-Host ("::error title=Build failed::" + $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'))
            exit $rc
          }
          Write-Host "::notice title=Build OK::$((Get-Content $log | Select-String 'FM1|fwsc|SHA' | Select-Object -Last 3) -join ' / ')"

      - uses: actions/upload-artifact@v4
        with:
          name: FM1-FM-PLAITS-firmware
          path: |
            ${{ env.FM1_ROOT }}\build\official-web\FM1-Official-Open-Source.html
            ${{ env.FM1_ROOT }}\build\dx7\generated\FM1_OFFICIAL_OPEN.fwsc
            ${{ env.FM1_ROOT }}\build\dx7\firmware-report.json
          if-no-files-found: error
